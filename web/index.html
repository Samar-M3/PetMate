<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="petmatee">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>petmatee</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Prevent any native HTML form submission from causing full page reload in Flutter Web SPA
    document.addEventListener('submit', function(e) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }, true);

    window.addEventListener('submit', function(e) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }, true);

    // Prevent Enter key on file input elements from triggering default browser submit / page reload
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var target = e.target;
        if (target && target.tagName === 'INPUT') {
          var type = (target.type || '').toLowerCase();
          if (type === 'file' || type === 'submit' || type === 'button') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }
        var fileInputs = document.querySelectorAll('input[type="file"]');
        if (fileInputs.length > 0) {
          // If a file picker input exists or was active, prevent Enter from bubbling into a page reload
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }
    }, true);

    window.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        var fileInputs = document.querySelectorAll('input[type="file"]');
        if (fileInputs.length > 0) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        var target = e.target;
        if (target && target.tagName === 'INPUT') {
          var type = (target.type || '').toLowerCase();
          if (type === 'file') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }
      }
    }, true);

    // Watch for dynamically added file inputs (like those from image_picker)
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
          if (node.tagName === 'INPUT' && (node.type || '').toLowerCase() === 'file') {
            node.addEventListener('change', function() {
              node.blur();
            });
            node.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
              }
            });
          }
        });
      });
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
